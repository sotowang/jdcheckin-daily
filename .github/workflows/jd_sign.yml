name: 京东每日领京豆

on:
  schedule:
    # 00:25 UTC = 08:25 Beijing time
    - cron: '25 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jd-bean-sign
  cancel-in-progress: false

jobs:
  bean-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out workflow code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sign in for JD Beans
        env:
          JD_COOKIE: ${{ secrets.JD_COOKIE }}
        run: python jd_sign.py
