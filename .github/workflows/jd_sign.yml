name: 京东每日免费签到、领豆与可选抽奖机会

on:
  schedule:
    # 00:25 UTC = 08:25 Beijing time
    - cron: '25 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jd-free-daily
  cancel-in-progress: false

jobs:
  free-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out workflow code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run JD free check-ins, beans and optional draw chance
        env:
          JD_COOKIE: ${{ secrets.JD_COOKIE }}
          JD_FREE_DRAW_EALD: ${{ vars.JD_FREE_DRAW_EALD }}
        run: python jd_sign.py
